name: Build APK

# Publishes an installable debug APK to a rolling GitHub Release, so a
# study phone can download it straight from the browser without anyone
# needing Android Studio locally.
on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # packages: '' is load-bearing. The action's default is to install
      # "tools", a package Google removed years ago, and sdkmanager exits 1
      # on it. The runner image already ships the SDK; Gradle fetches any
      # missing platform itself.
      - uses: android-actions/setup-android@v3
        with:
          packages: ""

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        working-directory: android
        run: ./gradlew test --no-daemon

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # A fixed file name on purpose: the release page is what someone
      # opens on a phone, and two similarly-named APKs there is an easy
      # way to install the wrong one. The commit is named in the release
      # body instead.
      - name: Stage the APK
        id: rename
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/capture-latest.apk
          echo "path=dist/capture-latest.apk" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Kept as a build artifact too: downloadable while signed in, and
      # retained even after the rolling release moves on.
      - uses: actions/upload-artifact@v4
        with:
          name: capture-apk-${{ steps.rename.outputs.sha }}
          path: ${{ steps.rename.outputs.path }}
          retention-days: 30

      - name: Publish to the rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Latest debug APK
          prerelease: true
          body: |
            Debug build of the capture app, rebuilt on every push to `android/`.

            **Commit:** `${{ steps.rename.outputs.sha }}` on `${{ github.ref_name }}`
            **Built:** ${{ github.run_started_at }}

            Install on the study phone: open this page in the phone's browser,
            download the `.apk` below, and allow installation from unknown
            sources when prompted. Debug builds are unsigned for distribution
            and are for research devices only.
          files: ${{ steps.rename.outputs.path }}

      # Earlier runs uploaded commit-stamped names; drop anything that is
      # not the current APK so the page offers exactly one download.
      - name: Drop superseded APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk-latest --json assets --jq '.assets[].name' \
            | grep -v '^capture-latest\.apk$' \
            | while read -r asset; do
                echo "removing $asset"
                gh release delete-asset apk-latest "$asset" --yes || true
              done
