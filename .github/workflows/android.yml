name: Build APK

# Publishes an installable debug APK to a rolling GitHub Release, so a
# study phone can download it straight from the browser without anyone
# needing Android Studio locally.
on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # packages: '' is load-bearing. The action's default is to install
      # "tools", a package Google removed years ago, and sdkmanager exits 1
      # on it. The runner image already ships the SDK; Gradle fetches any
      # missing platform itself.
      - uses: android-actions/setup-android@v3
        with:
          packages: ""

      - uses: gradle/actions/setup-gradle@v4

      # Resource compilation rejects "--" inside an XML comment, and the
      # failure it produces names a row and column rather than the rule.
      # Cheaper to catch here than three minutes into a Gradle build.
      # Resource compilation rejects malformed XML, "--" inside a
      # comment, and a duplicate resource name. The last of those cost
      # four consecutive builds -- every push in between never reached
      # a phone -- because this check only looked at the first two.
      - name: Check Android resources
        run: |
          python3 - <<'CHECK'
          import collections, pathlib, re, sys, xml.etree.ElementTree as ET
          bad = []
          for path in pathlib.Path("android").rglob("*.xml"):
              if "build/" in str(path):
                  continue
              text = path.read_text(encoding="utf-8")
              try:
                  root = ET.fromstring(text)
              except ET.ParseError as error:
                  bad.append(f"{path}: {error}")
                  continue
              for match in re.finditer(r"<!--(.*?)-->", text, re.S):
                  if "--" in match.group(1):
                      bad.append(f"{path}: '--' inside an XML comment")
              if root.tag == "resources":
                  names = [
                      (child.tag, child.get("name"))
                      for child in root
                      if child.get("name")
                  ]
                  for key, count in collections.Counter(names).items():
                      if count > 1:
                          bad.append(f"{path}: {key[0]} '{key[1]}' defined {count} times")
          for line in bad:
              print(line)
          sys.exit(1 if bad else 0)
          CHECK

      - name: Unit tests
        working-directory: android
        run: ./gradlew test --no-daemon

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # A fixed file name on purpose: the release page is what someone
      # opens on a phone, and two similarly-named APKs there is an easy
      # way to install the wrong one. The commit is named in the release
      # body instead.
      - name: Stage the APK
        id: rename
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/capture-latest.apk
          echo "path=dist/capture-latest.apk" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Kept as a build artifact too: downloadable while signed in, and
      # retained even after the rolling release moves on.
      - uses: actions/upload-artifact@v4
        with:
          name: capture-apk-${{ steps.rename.outputs.sha }}
          path: ${{ steps.rename.outputs.path }}
          retention-days: 30

      - name: Publish to the rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Latest debug APK
          prerelease: true
          body: |
            Debug build of the capture app, rebuilt on every push to `android/`.

            **Commit:** `${{ steps.rename.outputs.sha }}` on `${{ github.ref_name }}`
            **Built:** ${{ github.run_started_at }}

            Install on the study phone: open this page in the phone's browser,
            download the `.apk` below, and allow installation from unknown
            sources when prompted. Debug builds are unsigned for distribution
            and are for research devices only.
          files: ${{ steps.rename.outputs.path }}

      # Earlier runs uploaded commit-stamped names; drop anything that is
      # not the current APK so the page offers exactly one download.
      - name: Drop superseded APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk-latest --json assets --jq '.assets[].name' \
            | grep -v '^capture-latest\.apk$' \
            | while read -r asset; do
                echo "removing $asset"
                gh release delete-asset apk-latest "$asset" --yes || true
              done
